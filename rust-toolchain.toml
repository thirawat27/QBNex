# Rust toolchain for every crate in this workspace (pinned so CI and local builds match).
# scripts\setup_win.cmd adds only the target it builds qb-exec for (rustc's host target,
# or QBNEX_RUST_TARGET); no MinGW target or C toolchain is needed.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"

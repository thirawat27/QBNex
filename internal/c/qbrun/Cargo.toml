[package]
name = "qbrun"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "R11 spike: prebuilt runner that executes QBNex IR (QIR) emitted by the BASIC compiler with `--ir`. No C++ compiler needed at user compile time."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "qbrun"
path = "src/main.rs"

[dependencies]
qbrt = { path = "../qbrt" }

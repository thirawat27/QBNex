[package]
name = "qbrt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "QBNex runtime in Rust. Replaces libqb.cpp subsystems through a C ABI (strangler migration)."
publish = false

[lib]
# staticlib: linked into qb-stage0, qb and every user program next to libqb_*.o
# rlib: used by Rust unit tests and tools
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Audio runtime (R6). Its own crate so that its object file is only pulled into
# programs whose libqb references qbrt_snd_* (DEPENDENCY_AUDIO_OUT).
qbrt-audio = { path = "audio" }
ab_glyph_rasterizer = "0.1.10"
png = "0.18"
skrifa = "0.36.0"
zune-jpeg = "0.5.15"

name: Pull Request CI

on:
  pull_request:
    branches: ["main", "rust-port"]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runs_on: ubuntu-latest
            artifact_suffix: lnx
            artifact_path: qb
            build_command: QBNEX_CI=1 bash ./scripts/setup_lnx.sh
          - target: macos
            runs_on: macos-latest
            artifact_suffix: osx
            artifact_path: qb
            build_command: QBNEX_CI=1 bash ./scripts/setup_osx.command
          - target: windows-x64
            runs_on: windows-latest
            artifact_suffix: win-x64
            artifact_path: qb.exe
            platform: x64
    env:
      QBNEX_CI: "1"
      PLATFORM: ${{ matrix.platform || '' }}
      QBNEX_BUNDLE_DIR: dist/bundle/qbnex
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: for i in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libncurses-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev pkg-config && break; sleep 20; done

      # rust-toolchain.toml pins the version; rustup installs it (and its components) here.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build compiler (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Build compiler (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\setup_win.cmd

      - name: Build Rust workspace
        shell: bash
        # Not --all-targets: it builds qb-web's cdylib twice (lib, and lib for the
        # integration tests) under one unhashed name, qb_web.dll, and MSVC fails with LNK1104.
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked --no-run

      # Linux overcommit defeats try_reserve, so the image decoder fuzz test can OOM the
      # runner instead of failing the allocation; cap virtual memory per test process.
      - name: Rust workspace tests
        shell: bash
        env:
          QB_AUDIO_DEVICE: none
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 8000000; fi
          cargo test --workspace --locked --no-fail-fast



      - name: Smoke tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for t in cli diagnostics warnings labels encoding stdlib audio; do
            echo "::group::${t}_smoke"; sh "tests/smoke/${t}_smoke.sh"; echo "::endgroup::"
          done

      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for %%t in (cli diagnostics warnings labels encoding stdlib audio) do (
            call tests\smoke\%%t_smoke.cmd || exit /b 1
          )

      - name: Conformance (golden output)
        shell: bash
        run: cargo run --locked --release -p qbnex-conformance -- --timeout 60

      - name: Self-host fixpoint (gen2 == gen3, both pass conformance; L-00)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/selfhost_fixpoint.sh

      - name: Self-host fixpoint (gen2 == gen3, both pass conformance; L-00) (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\selfhost_fixpoint.cmd

      - name: Stage portable bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./.github/scripts/portable_bundle.sh "${{ matrix.artifact_path }}" "${{ env.QBNEX_BUNDLE_DIR }}"

      - name: Stage portable bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/portable_bundle.ps1 -BinaryPath "${{ matrix.artifact_path }}" -OutputDir "${{ env.QBNEX_BUNDLE_DIR }}" -WrapperPath "qb.cmd" -AliasWrapperPath "qbnex.cmd"

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbnex_pr_${{ github.sha }}_${{ matrix.artifact_suffix }}
          path: ${{ github.workspace }}/${{ env.QBNEX_BUNDLE_DIR }}
          if-no-files-found: error

name: Release CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to create or update the release for
        required: true
        type: string
      release_name:
        description: Optional display name for the GitHub release
        required: false
        default: ""
        type: string
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean

# Two runs for one tag would upload the same asset names at the same time.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag reaches shell scripts and asset names only through env (never ${{ }} inside run:),
  # and must be a version tag that matches [workspace.package] version in Cargo.toml.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $re ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a version tag (vMAJOR.MINOR.PATCH[-suffix])."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the workspace version
        shell: bash
        run: |
          version=$(awk '/^\[/{s=($0=="[workspace.package]")} s && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/,""); print; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::No version in [workspace.package] of Cargo.toml."
            exit 1
          fi
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match Cargo.toml version '$version'."
            exit 1
          fi

  build:
    needs: check-tag
    runs-on: ${{ matrix.runs_on }}
    # Clean build, tests and (macOS) up to 30 minutes of notarization.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runs_on: ubuntu-latest
            artifact_suffix: lnx
            artifact_path: qb
            build_command: bash ./scripts/setup_lnx.sh
          - target: macos
            runs_on: macos-latest
            artifact_suffix: osx
            artifact_path: qb
            build_command: bash ./scripts/setup_osx.command
          - target: windows-x64
            runs_on: windows-latest
            artifact_suffix: win-x64
            artifact_path: qb.exe
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      QBNEX_CI: "1"
      QBNEX_BUNDLE_DIR: dist/bundle/qbnex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: for i in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev libudev-dev libxkbcommon-dev libx11-dev pkg-config && break; sleep 20; done

      # rust-toolchain.toml pins the version; rustup installs it (and its components) here.
      # No cargo cache here: release builds start clean.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV

      - name: Build compiler (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Build compiler (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\setup_win.cmd

      # Same verification as the CI build job (ci.yml) before anything is packaged.
      # Linux overcommit defeats try_reserve, so the image decoder fuzz test can OOM the
      # runner instead of failing the allocation; cap virtual memory per test process.
      - name: Rust workspace tests
        shell: bash
        env:
          QB_AUDIO_DEVICE: none
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ulimit -v 8000000; fi
          cargo test --workspace --locked

      - name: Conformance (golden output)
        shell: bash
        run: cargo run --locked --release -p qbnex-conformance -- --timeout 60

      # The tools behind `qbnex fmt|lsp|dap` go into the bundle; qbnex-setup builds the installer.
      - name: Build developer tools and installer
        shell: bash
        run: cargo build --locked --release -p qb-fmt -p qb-lsp -p qb-dap -p qb-setup

      # Code signing runs only when the repository has the signing secrets; without them
      # it prints a notice and the release is built unsigned. Only qb-fmt, qb-lsp and
      # qb-dap are signed: qb, the runner copies (every compiled program) and the
      # one-file installers carry data appended after the executable and are found by a
      # trailer at the end of the file, which a signature would break (Windows) or which
      # codesign refuses (macOS). The secrets and their format are in CONTRIBUTING.md.
      - name: Sign developer tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Output "::notice::Windows code signing skipped: WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD are not set."
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          $files = @('qb-fmt', 'qb-lsp', 'qb-dap') | ForEach-Object { "target/release/$_.exe" }
          $pfx = Join-Path $env:RUNNER_TEMP 'qbnex-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERT_PASSWORD @files
            if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa /v @files
            if ($LASTEXITCODE) { throw "signtool verify failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Sign and notarize developer tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for v in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::notice::macOS code signing skipped: $v is not set."
              exit 0
            fi
          done
          files="target/release/qb-fmt target/release/qb-lsp target/release/qb-dap"
          keychain="$RUNNER_TEMP/qbnex-sign.keychain-db"
          p12="$RUNNER_TEMP/qbnex-sign.p12"
          stage="$RUNNER_TEMP/qbnex-notarize"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$p12" "$stage" "$stage.zip"
          }
          trap cleanup EXIT
          kc_pass=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -n 1 | awk '{print $2}' || true)
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity for team $APPLE_TEAM_ID in APPLE_CERT_P12_BASE64."
            exit 1
          fi
          mkdir -p "$stage"
          for f in $files; do
            codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$f"
            codesign --verify --strict --verbose=2 "$f"
            cp "$f" "$stage/"
          done
          # Bare executables cannot be stapled: Gatekeeper looks the ticket up online.
          ditto -c -k --keepParent "$stage" "$stage.zip"
          result=$(xcrun notarytool submit "$stage.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json)
          status=$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')
          if [ "$status" != "Accepted" ]; then
            id=$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))')
            [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarization finished with status '$status'."
            exit 1
          fi
          echo "Notarized: $files"

      - name: Stage portable bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./.github/scripts/portable_bundle.sh "${{ matrix.artifact_path }}" "${{ env.QBNEX_BUNDLE_DIR }}"

      - name: Stage portable bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/portable_bundle.ps1 -BinaryPath "${{ matrix.artifact_path }}" -OutputDir "${{ env.QBNEX_BUNDLE_DIR }}" -WrapperPath "qb.cmd" -AliasWrapperPath "qbnex.cmd"

      - name: Package compiler artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle_dir="${QBNEX_BUNDLE_DIR}"
          mkdir -p dist
          tar -czf "dist/qbnex_${RELEASE_TAG}_${{ matrix.artifact_suffix }}.tar.gz" -C "$(dirname "${bundle_dir}")" "$(basename "${bundle_dir}")"

      - name: Package compiler artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:QBNEX_BUNDLE_DIR" -DestinationPath "dist/qbnex_$($env:RELEASE_TAG)_${{ matrix.artifact_suffix }}.zip" -Force

      # One-file installer: qbnex-setup with the bundle appended (no Inno Setup). Installed
      # into a scratch folder, run, and uninstalled again before it is published.
      - name: Make and check installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          setup="dist/qbnex_${RELEASE_TAG}_${{ matrix.artifact_suffix }}-setup"
          target/release/qbnex-setup --pack "$QBNEX_BUNDLE_DIR" --out "$setup"
          dir="$RUNNER_TEMP/qbnex-install"
          "$setup" --yes --no-path --no-menu --dir "$dir"
          "$dir/qb" --version
          "$dir/qbnex-setup" --uninstall --yes --dir "$dir"
          test ! -e "$dir/qb"

      - name: Make and check installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist/qbnex_$($env:RELEASE_TAG)_${{ matrix.artifact_suffix }}-setup.exe"
          target/release/qbnex-setup.exe --pack "$env:QBNEX_BUNDLE_DIR" --out $setup
          if ($LASTEXITCODE) { exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'qbnex-install'
          & $setup --yes --no-path --no-menu --dir $dir
          if ($LASTEXITCODE) { exit 1 }
          & (Join-Path $dir 'qb.exe') --version
          if ($LASTEXITCODE) { exit 1 }
          & (Join-Path $dir 'qbnex-setup.exe') --uninstall --yes --dir $dir
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'qb.exe')) { throw 'uninstall left qb.exe behind' }

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: ${{ github.workspace }}/dist/qbnex_${{ env.RELEASE_TAG }}_${{ matrix.artifact_suffix }}*
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || '' }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      # Most assets are not code-signed, so the checksums are how a download is verified:
      #   sha256sum -c SHA256SUMS.txt --ignore-missing
      - name: Write checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes from changelog
        shell: bash
        run: bash ./.github/scripts/release_notes.sh CHANGELOG.md "$RELEASE_TAG" release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME != '' && env.RELEASE_NAME || env.RELEASE_TAG }}
          draft: ${{ env.RELEASE_DRAFT == 'true' }}
          body_path: release-notes.md
          files: release-assets/*

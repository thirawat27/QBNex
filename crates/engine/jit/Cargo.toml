[package]
name = "qb-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cranelift JIT tier for QBNex programs. Compiles typed functions/loops to native code at run time."
publish = false

[lib]
name = "qb_jit"
path = "src/lib.rs"

[features]
# Export the runtime helpers under the names AOT objects import (qb-native).
native-syms = []

[dependencies]
qb-runtime = { path = "../../runtime/core" }

# Cranelift is native-only; a browser build uses src/off.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The default `host-arch` back end only: a runner never generates code for another machine.
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"

[dev-dependencies]
qb-link = { path = "../link" }

# The tests check the lowering for the other machines too (Target::X86_64, Target::Aarch64, ...).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranelift-codegen = { version = "0.137", features = ["x86", "arm64"] }

[package]
name = "qb-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Prebuilt runner that executes QBNex IR (QIR) emitted by the BASIC compiler."
publish = false

[lib]
name = "qb_exec"
path = "src/lib.rs"

[[bin]]
name = "qb-exec"
path = "src/main.rs"

[features]
# Statement hook + variable inspection for the debug adapter (qb-dap).
# Off by default: without it the VM has no debugger code at all.
debug = []
# GPU (wgpu) window presentation and the 3D layer (_DRAW3D, _LOADMODEL, _SHADER).
# The setup scripts and release bundles turn it on; without an adapter the runner
# keeps the software presenter and _GPU3D returns 0.
gpu = ["qb-runtime/gpu"]
# Export the VM entry points native code calls under their AOT import names
# (qb_host_<i>, qb_vm_op); used by the qb-native runtime library.
native-syms = ["qb-jit/native-syms"]

[dependencies]
# fast hashing of names and registers while a program loads
rustc-hash = "2.1"
qb-runtime = { path = "../../runtime/core" }
qb-ir = { path = "../../compiler/ir" }
qb-jit = { path = "../jit" }
qb-link = { path = "../link" }
# layout of a compiled program (payload forms, packed runner)
qb-payload = { path = "../payload" }
qb-float80 = { path = "../../runtime/float80" }
qb-audio = { path = "../../runtime/audio" }
# DECLARE LIBRARY: call thunks, and the extension library resolved in-process
qb-ffi = { path = "../ffi" }
qb-ext = { path = "../../runtime/ext" }
# INSTR / _INSTRREV substring search
memchr = "2.8"
# builtin call arguments without an allocation per call
smallvec = "1.16"

[package]
name = "qb-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "R11 spike: prebuilt runner that executes QBNex IR (QIR) emitted by the BASIC compiler with `--ir`. No C++ compiler needed at user compile time."
publish = false

[lib]
name = "qb_exec"
path = "src/lib.rs"

[[bin]]
name = "qb-exec"
path = "src/main.rs"

[features]
# Statement hook + variable inspection for the debug adapter (qb-dap).
# Off by default: without it the VM has no debugger code at all.
debug = []
# R15 G4: draw the 3D layer (_DRAW3D) on the GPU in captured frames.
gpu = ["qb-runtime/gpu"]
# Export the VM entry points native code calls under their AOT import names
# (qb_host_<i>, qb_vm_op); used by the qb-native runtime library.
native-syms = ["qb-jit/native-syms"]

[dependencies]
qb-runtime = { path = "../../runtime/core" }
qb-ir = { path = "../../compiler/ir" }
qb-jit = { path = "../jit" }
qb-link = { path = "../link" }
qb-float80 = { path = "../../runtime/float80" }
qb-audio = { path = "../../runtime/audio" }
# DECLARE LIBRARY: call thunks, and the extension library resolved in-process
qb-ffi = { path = "../ffi" }
qb-ext = { path = "../../runtime/ext" }

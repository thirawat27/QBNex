[package]
name = "qb-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "D15 final: runtime library of native QBNex executables. A standard linker (rust-lld) links it with the program's object file (qb-exec build --native-link)."
publish = false

[lib]
name = "qb_native"
path = "src/lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false
# --all-targets also builds the lib as a bench harness exe; it cannot link without
# the program's qb_native_entry (and clashes with msvcrt's atexit).
bench = false

[dependencies]
qb-exec = { path = "../exec", features = ["native-syms"] }
qb-jit = { path = "../jit", features = ["native-syms"] }

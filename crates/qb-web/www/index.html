<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBNex Web Runner</title>
<style>
  :root { --bg: #f4f4f0; --fg: #1d1d1b; --panel: #ffffff; --line: #d6d6cf; --accent: #1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #e9e9e4; --panel: #20201f; --line: #3a3a37; --accent: #7aa7ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  label { font-size: 13px; opacity: .8; display: block; margin-bottom: 4px; }
  canvas { width: 100%; image-rendering: pixelated; background: #000; display: block; border-radius: 4px; }
  textarea, pre { width: 100%; font: 13px/1.35 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px; margin: 0; }
  textarea { height: 110px; resize: vertical; }
  pre { min-height: 60px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 13px; opacity: .85; }
</style>
</head>
<body>
<main>
  <h1>QBNex Web Runner</h1>
  <div class="bar">
    <input type="file" id="file" accept=".qir,.txt">
    <button id="run" disabled>Run</button>
    <span id="status">loading qb_web.wasm…</span>
  </div>
  <div class="grid">
    <section>
      <label>Screen</label>
      <canvas id="screen" width="640" height="400"></canvas>
    </section>
    <section>
      <label for="stdin">Keyboard input for INPUT / LINE INPUT (one answer per line)</label>
      <textarea id="stdin" spellcheck="false"></textarea>
      <label style="margin-top:10px">Console output</label>
      <pre id="stdout"></pre>
    </section>
  </div>
  <section>
    <label for="qir">Program (QIR from <code>qb --ir</code>; pick a .qir file or paste it)</label>
    <textarea id="qir" spellcheck="false" style="height:180px"></textarea>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const canvas = $('screen');
const ctx = canvas.getContext('2d');
const worker = new Worker('worker.js', { type: 'module' });
let busy = false;

function draw(f) {
  if (!f) return;
  if (canvas.width !== f.width || canvas.height !== f.height) {
    canvas.width = f.width;
    canvas.height = f.height;
  }
  ctx.putImageData(new ImageData(f.rgba, f.width, f.height), 0, 0);
}

worker.onmessage = ({ data }) => {
  if (data.type === 'ready') {
    $('status').textContent = 'ready';
    $('run').disabled = false;
  } else if (data.type === 'fatal') {
    $('status').textContent = 'could not load qb_web.wasm: ' + data.message;
  } else if (data.type === 'frame') {
    draw(data.frame);
  } else if (data.type === 'stdout') {
    $('stdout').textContent = data.text;
  } else if (data.type === 'done') {
    const r = data.result;
    busy = false;
    $('run').disabled = false;
    draw(r.frame);
    $('stdout').textContent = r.stdout;
    const t = `${r.ms.toFixed(0)} ms`;
    $('status').textContent =
      r.status === 0 ? `finished (exit code ${r.exitCode}, ${t})`
      : r.status === 1 ? `runtime error ${r.error} on line ${r.line}: ${r.message}`
      : r.status === 2 ? `could not load the program: ${r.message}`
      : `stopped: ${r.message}`;
  }
};

$('file').onchange = async () => {
  const f = $('file').files[0];
  if (f) $('qir').value = await f.text();
};

$('run').onclick = () => {
  if (busy) return;
  busy = true;
  $('run').disabled = true;
  $('status').textContent = 'running…';
  $('stdout').textContent = '';
  let stdin = $('stdin').value;
  if (stdin && !stdin.endsWith('\n')) stdin += '\n';
  worker.postMessage({ qir: $('qir').value, stdin });
};
</script>
</body>
</html>

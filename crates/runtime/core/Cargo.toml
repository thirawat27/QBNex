[package]
name = "qb-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "QBNex runtime in Rust. Replaces libqb.cpp subsystems through a C ABI (strangler migration)."
publish = false

[lib]
name = "qb_runtime"
path = "src/lib.rs"

[dependencies]
# Audio runtime (R6). Its own crate so that its object file is only pulled into
# programs whose libqb references the audio entry points (DEPENDENCY_AUDIO_OUT).
qb-audio = { path = "../audio" }
# Regex, hashing, Base64/hex, zip, HTTP(S) for the BASIC stdlib (qb_ext_* C ABI),
# linked into the runner qb-exec so the stdlib's ext.* modules can call it through DECLARE LIBRARY.
qb-ext = { path = "../ext", optional = true }
# Software x87 80-bit float (`_FLOAT`): VAL rounding, f80 -> f64, STR$ of _FLOAT.
qb-float80 = { path = "../float80" }
ab_glyph_rasterizer = "0.1.10"
png = "0.18"
# _DEFLATE/_INFLATE (replaces the system zlib); a Rust port of zlib, already used by png via flate2.
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
skrifa = "0.49.0"
zune-jpeg = "0.5.15"
# Local time of day for TIMER's start-up reference (replaces localtime()).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["ext"]
ext = ["dep:qb-ext"]
# GPU window presentation (wgpu). Off by default: the software path is the reference.
gpu = ["dep:qb-gpu"]

[target.'cfg(windows)'.dependencies]
# Clipboard (CF_TEXT/CF_BITMAP), _SCREENIMAGE/_SCREENCLICK/_SCREENPRINT and the
# printer use Win32 directly, exactly like the legacy runtime. windows-sys links
# through raw-dylib import stubs, so no extra link flags are needed for them.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# R8: window + input (replaces freeglut/GLEW/gui.cpp). Not in a browser build
# (browser build): there the page is the window and qb-web draws the surfaces.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
# SUB _GL / _gl*: an OpenGL context on the program window; pure Rust
# (WGL on Windows, EGL/GLX through dlopen on Linux, CGL on macOS), no C toolchain
glutin = "0.32"
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# Present the window frame through the GPU (wgpu) when the feature is on;
# softbuffer stays the default and the fallback when no adapter/surface is available.
qb-gpu = { path = "../gpu", optional = true }

[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
# Clipboard text and images on Linux (X11/Wayland) and macOS.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
# Console LOCATE, COLOR, CLS, CSRLIN and POS on a Linux or macOS terminal.
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[dev-dependencies]
proptest = "1.12.0"

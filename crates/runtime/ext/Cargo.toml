[package]
name = "qb-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "QBNex extension library: regex, hashing, Base64/hex, zip and HTTP(S) for the BASIC stdlib (qb_ext_* functions)."
publish = false

[lib]
name = "qb_ext"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
crc32fast = "1.5.5"
hex = "0.4.3"
md-5 = "0.11.0"
regex = "1.13.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# Windows has no tz database on disk: the local time zone is looked up in the one
# jiff carries (other systems read /usr/share/zoneinfo).
[target.'cfg(windows)'.dependencies]
jiff = { version = "1.0.2", default-features = false, features = ["tzdb-bundle-platform"] }

# HTTP(S) needs sockets; a browser build reports HTTP as unavailable.
# TLS is rustls with the pure-Rust RustCrypto provider: no ring/aws-lc.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "0.1.0-pre.0"

[package]
name = "qb-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Source formatter for QBasic/QB64/QBNex (library and `qb-fmt` command)."
publish = false

[lib]
name = "qb_fmt"
path = "src/lib.rs"

[[bin]]
name = "qb-fmt"
path = "src/main.rs"

[dependencies]
qb-syntax = { path = "../../compiler/syntax" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[package]
name = "qb-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Self-contained QBNex installer: one executable that carries the release bundle and installs it per user."
publish = false

[[bin]]
name = "qbnex-setup"
path = "src/main.rs"

[features]
default = ["gui"]
# The setup wizard window. Without it the installer asks its questions in the terminal.
gui = ["dep:eframe", "dep:image", "dep:rfd", "dep:xkbcommon-dl"]

[dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "accesskit", "clipboard", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.18", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# winit (in eframe) aborts when libxkbcommon(-x11) is missing; checked before the window opens.
xkbcommon-dl = { version = "0.4.2", features = ["x11"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

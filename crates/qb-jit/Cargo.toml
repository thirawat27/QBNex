[package]
name = "qb-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "R11.6: Cranelift JIT tier for QBNex programs. Compiles typed functions/loops to native code at run time (no linker, no C compiler)."
publish = false

[lib]
name = "qb_jit"
path = "src/lib.rs"

[features]
# Export the runtime helpers under the names AOT objects import (qb-native).
native-syms = []

[dependencies]
qb-runtime = { path = "../qb-runtime" }

# Cranelift is native-only; a browser build (R13-wasm) uses src/off.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = { version = "0.137", features = ["x86", "arm64"] }
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"

[dev-dependencies]
qb-link = { path = "../qb-link" }

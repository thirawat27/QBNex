[package]
name = "qb-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# cpal 0.18 needs 1.85, xmrsplayer 1.88
rust-version.workspace = true
description = "QBNex audio runtime (SOUND, BEEP, PLAY, _SND*, synth). Replaces internal/c/parts/audio."
publish = false

# A separate crate on purpose: the release profile builds each crate as one
# object file (codegen-units = 1), so keeping audio out of the `qb-runtime` crate is
# what lets console-only programs link libqb_runtime.a without pulling in the audio
# engine, cpal or the decoders. Nothing in libqb.cpp references an audio entry point
# unless DEPENDENCY_AUDIO_OUT is defined.
[lib]
name = "qb_audio"
path = "src/lib.rs"

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis", "flac"] }
xmrs = { version = "0.15", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.15", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }

# Audio output; a browser build (R13-wasm) hands PCM to the page instead (src/device.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"

[package]
name = "qb-exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "R11 spike: prebuilt runner that executes QBNex IR (QIR) emitted by the BASIC compiler with `--ir`. No C++ compiler needed at user compile time."
publish = false

[lib]
name = "qb_exec"
path = "src/lib.rs"

[[bin]]
name = "qb-exec"
path = "src/main.rs"

[features]
# Statement hook + variable inspection for the debug adapter (qb-dap).
# Off by default: without it the VM has no debugger code at all.
debug = []

[dependencies]
qb-runtime = { path = "../qb-runtime" }
qb-ir = { path = "../qb-ir" }
qb-jit = { path = "../qb-jit" }
qb-link = { path = "../qb-link" }
qb-float80 = { path = "../qb-float80" }
qb-audio = { path = "../qb-audio" }
# DECLARE LIBRARY: call thunks, and the extension library resolved in-process
qb-ffi = { path = "../qb-ffi" }
qb-ext = { path = "../qb-ext" }

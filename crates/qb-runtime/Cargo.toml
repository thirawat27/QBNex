[package]
name = "qb-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "QBNex runtime in Rust. Replaces libqb.cpp subsystems through a C ABI (strangler migration)."
publish = false

[lib]
name = "qb_runtime"
# staticlib: linked into qb-stage0, qb and every user program next to libqb_*.o
# rlib: used by Rust unit tests and tools
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Audio runtime (R6). Its own crate so that its object file is only pulled into
# programs whose libqb references the audio entry points (DEPENDENCY_AUDIO_OUT).
qb-audio = { path = "../qb-audio" }
# R13-ext: regex, hashing, Base64/hex, zip, HTTP(S) for the BASIC stdlib (qb_ext_* C ABI),
# linked into libqb_runtime.a so compiled programs can call it through DECLARE LIBRARY.
qb-ext = { path = "../qb-ext", optional = true }
# R11d: software x87 80-bit float (`_FLOAT`): VAL rounding, f80 -> f64, STR$ of _FLOAT.
qb-float80 = { path = "../qb-float80" }
ab_glyph_rasterizer = "0.1.10"
png = "0.18"
# R10: _DEFLATE/_INFLATE (replaces the system zlib); a Rust port of zlib, already used by png via flate2.
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
skrifa = "0.49.0"
zune-jpeg = "0.5.15"
# R8: window + input (replaces freeglut/GLEW/gui.cpp)
winit = "0.30"
softbuffer = "0.4"
# R15 G2: present the window frame through the GPU (wgpu) when the feature is on;
# softbuffer stays the default and the fallback when no adapter/surface is available.
qb-gpu = { path = "../qb-gpu", optional = true }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
# Local time of day for TIMER's start-up reference (replaces localtime()).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["ext"]
ext = ["dep:qb-ext"]
# GPU window presentation (wgpu). Off by default: the software path is the reference.
gpu = ["dep:qb-gpu"]

[target.'cfg(windows)'.dependencies]
# Clipboard (CF_TEXT/CF_BITMAP), _SCREENIMAGE/_SCREENCLICK/_SCREENPRINT and the
# printer use Win32 directly, exactly like the legacy runtime. windows-sys links
# through raw-dylib import stubs, so libqb_runtime.a needs no extra -l flags for them.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# Clipboard text and images on Linux (X11/Wayland) and macOS.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }

[dev-dependencies]
proptest = "1.12.0"

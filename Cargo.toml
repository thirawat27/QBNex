[workspace]
resolver = "2"
members = [
    "crates/runtime/core",
    "crates/runtime/audio",
    "crates/engine/exec",
    "crates/compiler/ir",
    "crates/engine/jit",
    "crates/engine/link",
    "crates/engine/native",
    "crates/runtime/gpu",
    "crates/runtime/float80",
    "crates/engine/ffi",
    "crates/compiler/syntax",
    "crates/tools/fmt",
    "crates/tools/lsp",
    "crates/runtime/ext",
    "crates/web",
    "crates/tools/dap",
    "crates/tools/setup",
    "tests/conformance",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = false

# The installer runs once: it and its window library are built small, not fast.
[profile.release.package.qb-setup]
opt-level = "z"
[profile.release.package.eframe]
opt-level = "z"
[profile.release.package.egui]
opt-level = "z"
[profile.release.package.epaint]
opt-level = "z"
[profile.release.package.emath]
opt-level = "z"
[profile.release.package.ecolor]
opt-level = "z"
[profile.release.package.egui-winit]
opt-level = "z"
[profile.release.package.egui_glow]
opt-level = "z"
[profile.release.package.glutin]
opt-level = "z"
[profile.release.package.glutin-winit]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.png]
opt-level = "z"
[profile.release.package.rfd]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.accesskit]
opt-level = "z"
[profile.release.package.accesskit_winit]
opt-level = "z"
[profile.release.package.accesskit_windows]
opt-level = "z"
[profile.release.package.accesskit_consumer]
opt-level = "z"

[profile.dev]
panic = "abort"

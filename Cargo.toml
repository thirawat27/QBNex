[workspace]
resolver = "2"
members = [
    "crates/runtime/core",
    "crates/runtime/audio",
    "crates/engine/exec",
    "crates/compiler/ir",
    "crates/engine/jit",
    "crates/engine/link",
    "crates/engine/native",
    "crates/engine/payload",
    "crates/engine/stub",
    "crates/runtime/gpu",
    "crates/runtime/float80",
    "crates/engine/ffi",
    "crates/compiler/syntax",
    "crates/tools/fmt",
    "crates/tools/lsp",
    "crates/runtime/ext",
    "crates/web",
    "crates/tools/dap",
    "crates/tools/setup",
    "tests/conformance",
    "crates/compat/paste",
]

[workspace.package]
version = "2.0.0-preview.5"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"

# `paste` is archived (RUSTSEC-2024-0436) and rustls-rustcrypto has no release
# without it: crates/compat/paste forwards to its maintained fork `pastey`.
[patch.crates-io]
paste = { path = "crates/compat/paste" }

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
# Fat LTO made the runner 3% smaller (1% once packed) for twice the build time and
# memory, so it stays off. The binaries keep no symbol table.
lto = false
strip = "symbols"

# The launcher is the first bytes of every compiled program: small. Brotli keeps
# opt-level 3, the runner unpacks at that speed.
[profile.release.package.qb-stub]
opt-level = "z"

# The installer runs once: it and its window library are built small, not fast.
[profile.release.package.qb-setup]
opt-level = "z"
[profile.release.package.eframe]
opt-level = "z"
[profile.release.package.egui]
opt-level = "z"
[profile.release.package.epaint]
opt-level = "z"
[profile.release.package.emath]
opt-level = "z"
[profile.release.package.ecolor]
opt-level = "z"
[profile.release.package.egui-winit]
opt-level = "z"
[profile.release.package.egui_glow]
opt-level = "z"
[profile.release.package.glutin]
opt-level = "z"
[profile.release.package.glutin-winit]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.png]
opt-level = "z"
[profile.release.package.rfd]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.accesskit]
opt-level = "z"
[profile.release.package.accesskit_winit]
opt-level = "z"
[profile.release.package.accesskit_windows]
opt-level = "z"
[profile.release.package.accesskit_consumer]
opt-level = "z"

[profile.dev]
panic = "abort"

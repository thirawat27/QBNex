[workspace]
resolver = "2"
members = [
    "crates/runtime/core",
    "crates/runtime/audio",
    "crates/engine/exec",
    "crates/compiler/ir",
    "crates/engine/jit",
    "crates/engine/link",
    "crates/engine/native",
    "crates/runtime/gpu",
    "crates/runtime/float80",
    "crates/engine/ffi",
    "crates/compiler/syntax",
    "crates/tools/fmt",
    "crates/tools/lsp",
    "crates/runtime/ext",
    "crates/web",
    "crates/tools/dap",
    "tests/conformance",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = false

[profile.dev]
panic = "abort"

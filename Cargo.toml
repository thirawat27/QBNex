[workspace]
resolver = "2"
members = [
    "crates/qb-runtime",
    "crates/qb-audio",
    "crates/qb-exec",
    "tests/conformance",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = false

[profile.dev]
panic = "abort"

[workspace]
resolver = "2"
members = [
    "crates/qb-runtime",
    "crates/qb-audio",
    "crates/qb-exec",
    "crates/qb-ir",
    "crates/qb-jit",
    "crates/qb-link",
    "crates/qb-gpu",
    "crates/qb-float80",
    "crates/qb-ffi",
    "crates/qb-syntax",
    "crates/qb-fmt",
    "crates/qb-lsp",
    "crates/qb-ext",
    "crates/qb-dap",
    "tests/conformance",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = false

[profile.dev]
panic = "abort"
